name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package the app
        run: scripts/build-app.sh

  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Lint
        run: make lint
